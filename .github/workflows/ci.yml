name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      # CI parity: one command, and it is exactly the local gate. `npm run ci`
      # chains lint, the brand gate, the build (which type-checks) and the
      # Playwright suite — responsive, a11y, hit targets and route smoke,
      # including the 404. Nothing runs here that does not run on a laptop.
      - name: Gate
        run: npm run ci

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  # Auto-deploy to Cloudflare Workers once the gate is green on main.
  # Uses exactly the local command (`npm run deploy`). Requires the
  # CLOUDFLARE_API_TOKEN repo secret (Cloudflare dashboard → My Profile →
  # API Tokens → "Edit Cloudflare Workers" template, scoped to this account).
  # Until that secret exists the deploy step skips with a notice instead of
  # failing, so a green check still means what it means.
  deploy:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      HAS_CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4
        if: env.HAS_CF_TOKEN == 'true'

      - uses: actions/setup-node@v4
        if: env.HAS_CF_TOKEN == 'true'
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        if: env.HAS_CF_TOKEN == 'true'
        run: npm ci

      - name: Deploy to Cloudflare Workers
        if: env.HAS_CF_TOKEN == 'true'
        run: npm run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 4d5acc1cdbc53403861c91ed80a6917d

      - name: Deploy skipped — secret missing
        if: env.HAS_CF_TOKEN != 'true'
        run: echo "CLOUDFLARE_API_TOKEN secret is not set; deploy skipped. Add the secret to enable auto-deploy."
