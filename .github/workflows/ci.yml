name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      # CI parity: one command, and it is exactly the local gate. `npm run ci`
      # chains lint, the brand gate, the build (which type-checks) and the
      # Playwright suite — responsive, a11y, hit targets and route smoke,
      # including the 404. Nothing runs here that does not run on a laptop.
      - name: Gate
        run: npm run ci

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
